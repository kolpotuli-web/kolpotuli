<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14283D"><title>Read — Kolpotuli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/desktop.css">
<style>html,body{margin:0;min-height:100%;background:#10283b;color:#172634}body{font-family:'DM Sans',sans-serif}.reader-desktop{min-height:100vh;background:linear-gradient(180deg,rgba(4,20,32,.08),rgba(4,20,32,.03)),url('assets/wallpapers/kolpotuli-main.png') center/cover fixed;position:relative;padding-top:38px;box-sizing:border-box}.reader-bar{position:fixed;z-index:10;top:0;left:0;right:0;height:38px;background:rgba(9,25,38,.84);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;font-size:12px}.reader-brand{display:flex;gap:9px;align-items:center;font-weight:700}.reader-brand b{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;background:#f0c65a;color:#14283d;font-family:'Noto Serif Bengali',serif}.reader-actions{display:flex;gap:8px}.reader-actions button{border:0;border-radius:9px;padding:6px 10px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}.reader-window{width:min(900px,calc(100vw - 34px));margin:34px auto 70px;background:rgba(255,250,238,.94);border:1px solid rgba(255,255,255,.55);border-radius:20px;box-shadow:0 28px 80px rgba(0,0,0,.32);overflow:hidden}.reader-head{padding:28px 34px 20px;border-bottom:1px solid rgba(20,40,61,.1)}.reader-type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#547f7a;font-weight:700}.reader-title{font-family:'Noto Serif Bengali',Georgia,serif;font-size:clamp(32px,5vw,56px);line-height:1.08;margin:9px 0 12px;color:#14283d}.reader-meta{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;opacity:.65}.reader-cover{width:100%;max-height:430px;object-fit:cover;display:block}.reader-body{padding:30px 34px 45px;max-width:760px;margin:auto;font-family:'Noto Serif Bengali',Georgia,serif;font-size:18px;line-height:1.9}.reader-body p{margin:0 0 1.15em}.reader-excerpt{font-size:20px;line-height:1.55;opacity:.78;margin-bottom:28px}.reader-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 24px;border-top:1px solid rgba(20,40,61,.1);font-size:12px}.favorite{border:0;border-radius:12px;background:#14283d;color:#fff;padding:9px 14px;cursor:pointer}.progress-track{position:fixed;z-index:20;top:38px;left:0;width:100%;height:3px;background:rgba(255,255,255,.15)}.progress-bar{height:100%;width:0;background:#f0c65a;transition:width .1s}.state{padding:80px;text-align:center}.error{color:#9c3d3d}@media(max-width:650px){.reader-head,.reader-body{padding-left:20px;padding-right:20px}.reader-window{width:calc(100vw - 18px);margin-top:18px}.reader-body{font-size:17px}.reader-footer{padding:13px 16px}}</style></head>
<body><div class="reader-desktop"><header class="reader-bar"><div class="reader-brand"><b>ক</b><span>Kolpotuli</span></div><div class="reader-actions"><button onclick="history.back()">← Back</button><button onclick="location.href='index.html'">Desktop</button></div></header><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><main id="reader" class="reader-window"><div class="state">Loading story…</div></main></div>
<script type="module">
import { supabase } from './js/supabase.js';
const reader=document.getElementById('reader'),bar=document.getElementById('progressBar');const params=new URLSearchParams(location.search),id=params.get('id');let item=null,user=null;const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
function bodyHtml(text){return String(text||'').split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}
async function load(){if(!id){reader.innerHTML='<div class="state error">No content selected.</div>';return}const r=await supabase.from('content_items').select('id,type,title,slug,excerpt,body,cover_image_url,language,read_time_minutes,published_at,author_id').eq('id',id).eq('status','published').maybeSingle();if(r.error||!r.data){reader.innerHTML='<div class="state error">This piece could not be found.</div>';return}item=r.data;const u=await supabase.auth.getUser();user=u.data.user;const date=item.published_at?new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'long',year:'numeric'}).format(new Date(item.published_at)):'';reader.innerHTML=`<header class="reader-head"><div class="reader-type">${esc(item.type)}${item.language?` · ${esc(item.language)}`:''}</div><h1 class="reader-title">${esc(item.title)}</h1><div class="reader-meta"><span>${date}</span>${item.read_time_minutes?`<span>· ${item.read_time_minutes} min read</span>`:''}</div></header>${item.cover_image_url?`<img class="reader-cover" src="${esc(item.cover_image_url)}" alt="">`:''}<article class="reader-body">${item.excerpt?`<div class="reader-excerpt">${esc(item.excerpt)}</div>`:''}${bodyHtml(item.body)}</article><footer class="reader-footer"><span id="progressText">0% read</span><button id="favorite" class="favorite">♡ Save</button></footer>`;document.getElementById('favorite').onclick=toggleFavorite;await markOpened();await loadSavedProgress();updateProgress()}
async function markOpened(){if(!user)return;await supabase.from('recently_opened').upsert({user_id:user.id,content_id:item.id,opened_at:new Date().toISOString()},{onConflict:'user_id,content_id'})}
async function loadSavedProgress(){if(!user)return;const r=await supabase.from('reading_progress').select('progress_percent').eq('user_id',user.id).eq('content_id',item.id).maybeSingle();if(r.data?.progress_percent){const p=Math.round(Number(r.data.progress_percent));bar.style.width=p+'%';document.getElementById('progressText')?.replaceChildren(`${p}% read`)}}
async function toggleFavorite(){if(!user){location.href='index.html?auth=1';return}const f=await supabase.from('favorites').select('content_id').eq('user_id',user.id).eq('content_id',item.id).maybeSingle();const b=document.getElementById('favorite');if(f.data){await supabase.from('favorites').delete().eq('user_id',user.id).eq('content_id',item.id);b.textContent='♡ Save'}else{await supabase.from('favorites').insert({user_id:user.id,content_id:item.id});b.textContent='♥ Saved'}}
async function saveProgress(){if(!user||!item)return;const max=document.documentElement.scrollHeight-innerHeight;const percent=max>0?Math.min(100,Math.round(scrollY/max*100)):100;await supabase.from('reading_progress').upsert({user_id:user.id,content_id:item.id,progress_percent:percent,last_read_at:new Date().toISOString()},{onConflict:'user_id,content_id'});document.getElementById('progressText')?.replaceChildren(`${percent}% read`);bar.style.width=percent+'%'}
function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;const p=max>0?Math.min(100,Math.round(scrollY/max*100)):0;bar.style.width=p+'%';document.getElementById('progressText')?.replaceChildren(`${p}% read`)}let timer;addEventListener('scroll',()=>{updateProgress();clearTimeout(timer);timer=setTimeout(saveProgress,400)});addEventListener('beforeunload',saveProgress);load();
</script></body></html>
