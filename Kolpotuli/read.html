<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14283d"><title>Read — Kolpotuli</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/desktop.css"><style>html,body{margin:0;min-height:100%;background:#10283b;color:#172634}body{font-family:"DM Sans",sans-serif}.reader-desktop{min-height:100vh;background:linear-gradient(180deg,rgba(4,20,32,.08),rgba(4,20,32,.03)),url("assets/wallpapers/kolpotuli-main.png") center/cover fixed;position:relative;padding-top:38px;box-sizing:border-box}.reader-bar{position:fixed;z-index:30;top:0;left:0;right:0;height:38px;background:rgba(9,25,38,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;font-size:12px}.reader-brand{display:flex;gap:9px;align-items:center;font-weight:700}.reader-brand b{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;background:#f0c65a;color:#14283d;font-family:"Noto Serif Bengali",serif}.reader-actions{display:flex;gap:8px}.reader-actions button,.favorite,.collection-button{border:0;border-radius:9px;padding:7px 11px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}.reader-actions button:focus-visible,.favorite:focus-visible,.collection-button:focus-visible,.collection-row button:focus-visible{outline:2px solid #f0c65a;outline-offset:2px}.reader-window{width:min(900px,calc(100vw - 34px));margin:34px auto 70px;background:rgba(255,250,238,.94);border:1px solid rgba(255,255,255,.55);border-radius:20px;box-shadow:0 28px 80px rgba(0,0,0,.32);overflow:hidden}.reader-head{padding:28px 34px 20px;border-bottom:1px solid rgba(20,40,61,.1)}.reader-type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#547f7a;font-weight:700}.reader-title{font-family:"Noto Serif Bengali",Georgia,serif;font-size:clamp(32px,5vw,56px);line-height:1.08;margin:9px 0 12px;color:#14283d}.reader-meta{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;opacity:.65}.reader-cover{width:100%;max-height:430px;object-fit:cover;display:block}.reader-body{padding:30px 34px 45px;max-width:760px;margin:auto;font-family:"Noto Serif Bengali",Georgia,serif;font-size:18px;line-height:1.9}.reader-body p{margin:0 0 1.15em}.reader-excerpt{font-size:20px;line-height:1.55;opacity:.78;margin-bottom:28px}.reader-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 24px;border-top:1px solid rgba(20,40,61,.1);font-size:12px}.footer-actions{display:flex;gap:7px}.favorite{background:#14283d}.collection-button{background:#547f7a}.progress-track{position:fixed;z-index:35;top:38px;left:0;width:100%;height:3px;background:rgba(255,255,255,.15)}.progress-bar{height:100%;width:0;background:#f0c65a;transition:width .1s}.state{padding:80px;text-align:center}.error{color:#9c3d3d}.collection-pop{position:fixed;z-index:50;right:18px;top:52px;width:min(340px,calc(100vw - 36px));background:rgba(255,250,238,.98);border-radius:16px;padding:14px;box-shadow:0 22px 70px rgba(0,0,0,.32);display:none;color:#14283d}.collection-pop.show{display:block}.collection-pop h3{margin:0 0 10px;color:#14283d}.collection-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:9px}.collection-row:hover{background:rgba(20,40,61,.06)}.collection-row span{flex:1}.collection-row button{border:0;border-radius:7px;padding:6px 8px;background:#14283d;color:#fff;cursor:pointer;font-size:10px}.collection-empty{font-size:11px;opacity:.6;padding:8px 0}.resume-note{font-size:11px;opacity:.55;margin-top:8px}@media(max-width:650px){.reader-desktop{background-attachment:scroll;padding-top:38px}.reader-bar{padding:0 10px}.reader-actions button{padding:7px 9px}.reader-head,.reader-body{padding-left:20px;padding-right:20px}.reader-window{width:calc(100vw - 18px);margin-top:18px}.reader-body{font-size:17px}.reader-footer{padding:13px 16px;flex-wrap:wrap}.footer-actions{width:100%}.footer-actions button{flex:1}.collection-pop{right:9px;width:calc(100vw - 18px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}</style></head><body><div class="reader-desktop"><header class="reader-bar"><div class="reader-brand"><b aria-hidden="true">ক</b><span>Kolpotuli</span></div><div class="reader-actions"><button type="button" id="back">← Back</button><button type="button" id="desktop">Desktop</button></div></header><div class="progress-track" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div><main id="reader" class="reader-window" aria-live="polite"><div class="state">Loading…</div></main><aside id="collectionPop" class="collection-pop" aria-label="Collections"></aside></div><script type="module">
import { supabase } from './js/supabase.js';
const reader=document.getElementById('reader'),bar=document.getElementById('progressBar'),pop=document.getElementById('collectionPop');const params=new URLSearchParams(location.search),id=params.get('id');let item=null,user=null;const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function bodyHtml(text){return String(text||'').split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}
async function load(){if(!id){reader.innerHTML='<div class="state error">No content selected.</div>';return}const r=await supabase.from('content_items').select('id,type,title,slug,excerpt,body,cover_image_url,language,read_time_minutes,published_at,author_id').eq('id',id).eq('status','published').maybeSingle();if(r.error||!r.data){reader.innerHTML='<div class="state error">This piece could not be found.</div>';return}item=r.data;user=(await supabase.auth.getUser()).data.user;let progress=0;if(user){const p=await supabase.from('reading_progress').select('progress_percent').eq('user_id',user.id).eq('content_id',item.id).maybeSingle();progress=Number(p.data?.progress_percent)||0}const date=item.published_at?new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'long',year:'numeric'}).format(new Date(item.published_at)):'';reader.innerHTML=`<header class="reader-head"><div class="reader-type">${esc(item.type)}${item.language?` · ${esc(item.language)}`:''}</div><h1 class="reader-title">${esc(item.title)}</h1><div class="reader-meta"><span>${date}</span>${item.read_time_minutes?`<span>· ${item.read_time_minutes} min read</span>`:''}</div></header>${item.cover_image_url?`<img class="reader-cover" src="${esc(item.cover_image_url)}" alt="${esc(item.title)}">`:''}<article class="reader-body">${item.excerpt?`<div class="reader-excerpt">${esc(item.excerpt)}</div>`:''}${bodyHtml(item.body)}${progress>0&&progress<100?`<div class="resume-note">Previously read: ${progress}%</div>`:''}</article><footer class="reader-footer"><span id="progressText">${progress}% read</span><div class="footer-actions"><button type="button" id="collection" class="collection-button">＋ Collection</button><button type="button" id="favorite" class="favorite">♡ Save</button></div></footer>`;document.getElementById('favorite').onclick=toggleFavorite;document.getElementById('collection').onclick=toggleCollections;await markOpened();updateProgress()}
async function markOpened(){if(!user)return;await supabase.from('recently_opened').upsert({user_id:user.id,content_id:item.id,opened_at:new Date().toISOString()},{onConflict:'user_id,content_id'})}
async function toggleFavorite(){if(!user){location.href='index.html?auth=1';return}const f=await supabase.from('favorites').select('content_id').eq('user_id',user.id).eq('content_id',item.id).maybeSingle();const b=document.getElementById('favorite');if(f.data){await supabase.from('favorites').delete().eq('user_id',user.id).eq('content_id',item.id);b.textContent='♡ Save'}else{await supabase.from('favorites').insert({user_id:user.id,content_id:item.id});b.textContent='♥ Saved'}}
async function toggleCollections(){if(!user){location.href='index.html?auth=1';return}if(pop.classList.contains('show')){pop.classList.remove('show');return}const{data,error}=await supabase.from('collections').select('id,name').eq('user_id',user.id).order('name');if(error){pop.innerHTML='<div class="collection-empty">Could not load collections.</div>';pop.classList.add('show');return}pop.innerHTML=`<h3>Add to collection</h3>${data?.length?data.map(c=>`<div class="collection-row"><span>${esc(c.name)}</span><button type="button" data-add="${esc(c.id)}">Add</button></div>`).join(''):'<div class="collection-empty">No collections yet. Create one from Library → Collections.</div>'}`;pop.classList.add('show');pop.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{const r=await supabase.from('collection_items').upsert({collection_id:b.dataset.add,content_id:item.id},{onConflict:'collection_id,content_id'});b.textContent=r.error?'Failed':'Added'})}
async function saveProgress(){if(!user||!item)return;const max=document.documentElement.scrollHeight-innerHeight;const percent=max>0?Math.min(100,Math.round(scrollY/max*100)):100;await supabase.from('reading_progress').upsert({user_id:user.id,content_id:item.id,progress_percent:percent,last_opened_at:new Date().toISOString()},{onConflict:'user_id,content_id'});document.getElementById('progressText')?.replaceChildren(`${percent}% read`);bar.style.width=percent+'%'}
function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;const p=max>0?Math.min(100,Math.round(scrollY/max*100)):0;bar.style.width=p+'%';document.getElementById('progressText')?.replaceChildren(`${p}% read`)}let timer;addEventListener('scroll',()=>{updateProgress();clearTimeout(timer);timer=setTimeout(saveProgress,400)});addEventListener('beforeunload',saveProgress);document.getElementById('back').onclick=()=>history.back();document.getElementById('desktop').onclick=()=>{location.href='index.html'};load();
</script></body></html>
