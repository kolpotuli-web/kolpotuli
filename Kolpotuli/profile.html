<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283d"><title>Kolpotuli Profile</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--navy:#10283d;--deep:#081725;--gold:#f4b52c;--ink:#14202a;--line:rgba(255,255,255,.18);--focus:#f4b52c}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:radial-gradient(circle at top,#173a55 0,#10283d 45%,#081725 100%);color:#fff;font-family:"DM Sans",system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:56px 24px}.card{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:24px;padding:28px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(0,0,0,.28)}.avatar{width:80px;height:80px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:700 34px "Noto Serif Bengali",serif}.card h1{margin:18px 0 6px;font-size:28px;line-height:1.15}.email{margin:0 0 26px;opacity:.68}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.68;margin-bottom:7px}.field input,.field textarea{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;box-sizing:border-box;font:inherit;outline:none}.field textarea{min-height:110px;resize:vertical}.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.42)}.field input:focus-visible,.field textarea:focus-visible,.actions button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button{padding:11px 15px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.save{background:var(--gold);color:var(--navy)}.out{background:rgba(255,255,255,.1);color:#fff}.status{min-height:22px;margin-top:12px;color:#f6edd9}@media(max-width:560px){.wrap{padding:24px 14px}.card{padding:20px}.card h1{font-size:24px}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}</style></head><body><main class="wrap"><section class="card" aria-labelledby="profile-title"><div class="avatar" aria-hidden="true">ক</div><h1 id="profile-title">Kolpotuli Profile</h1><p id="email" class="email"></p><div class="field"><label for="name">Display name</label><input id="name" autocomplete="name"></div><div class="field"><label for="username">Username</label><input id="username" autocomplete="username"></div><div class="field"><label for="bio">Bio</label><textarea id="bio"></textarea></div><div class="actions"><button class="save" id="save" type="button">Save profile</button><button class="out" id="logout" type="button">Sign out</button><button class="out" id="desktop" type="button">Desktop</button></div><div class="status" id="status" aria-live="polite"></div></section></main><script type="module">import{supabase}from'./js/supabase.js';const $=x=>document.getElementById(x);async function load(){const{data:{user}}=await supabase.auth.getUser();if(!user){location.href='index.html?auth=1';return}$('email').textContent=user.email||'';const{data}=await supabase.from('profiles').select('*').eq('id',user.id).single();if(data){$('name').value=data.display_name||'';$('username').value=data.username||'';$('bio').value=data.bio||''}}$('save').onclick=async()=>{const{data:{user}}=await supabase.auth.getUser();if(!user)return;const{error}=await supabase.from('profiles').update({display_name:$('name').value.trim()||null,username:$('username').value.trim()||null,bio:$('bio').value.trim()||null}).eq('id',user.id);$('status').textContent=error?error.message:'Profile saved.'};$('logout').onclick=async()=>{await supabase.auth.signOut();location.href='index.html'};$('desktop').onclick=()=>{location.href='index.html'};load();</script></body></html>
