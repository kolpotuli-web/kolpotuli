<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283d"><title>Kolpotuli Profile</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--profile-ink:var(--mac-ink,#f1f0e9);--profile-muted:rgba(255,255,255,.68);--profile-line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(circle at 20% 0,rgba(91,139,159,.24),transparent 35%),linear-gradient(135deg,#071b29,#173a55);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"DM Sans","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:52px 22px}
.card{background:rgba(36,54,65,.79);border:.5px solid var(--profile-line);border-radius:13px;padding:28px;backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);box-shadow:0 2px 8px rgba(0,0,0,.1),0 20px 60px rgba(0,0,0,.18)}
.avatar{width:64px;height:64px;border-radius:17px;background:#f4b52c;color:#10283d;display:grid;place-items:center;font:700 30px "Noto Serif Bengali",serif}
.card h1{margin:17px 0 6px;font-size:26px;line-height:1.2;letter-spacing:-.025em}
.email{margin:0 0 24px;color:var(--profile-muted);font-size:12px}
.field{margin:15px 0}
.field label{display:block;font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--profile-muted);margin-bottom:7px}
.field input,.field textarea{width:100%;padding:11px 12px;border-radius:7px;border:.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:13px;outline:none}
.field textarea{min-height:120px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.42)}
.field input:focus-visible,.field textarea:focus-visible,.actions button:focus-visible{outline:2px solid #f4b52c;outline-offset:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.actions button{min-height:34px;padding:9px 13px;border:1px solid #d1d5db;border-radius:7px;background:#f2f2f2;color:#4b5563;font-size:12px;font-weight:600;cursor:pointer}
.actions button:hover{background:#e5e7eb;border-color:#aeb4bb;color:#374151}
.actions button:focus-visible{outline:2px solid #9ca3af;outline-offset:3px}
.status{min-height:22px;margin-top:12px;color:#f6edd9;font-size:12px}
@media(max-width:560px){.wrap{padding:22px 12px}.card{padding:20px}.card h1{font-size:23px}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body><main class="wrap"><section class="card" aria-labelledby="profile-title"><div class="avatar" aria-hidden="true">ক</div><h1 id="profile-title">Kolpotuli Profile</h1><p id="email" class="email"></p><div class="field"><label for="name">Display name</label><input id="name" autocomplete="name"></div><div class="field"><label for="username">Username</label><input id="username" autocomplete="username"></div><div class="field"><label for="bio">Bio</label><textarea id="bio"></textarea></div><div class="actions"><button class="save" id="save" type="button">Save profile</button><button class="out" id="logout" type="button">Sign out</button><button class="out" id="desktop" type="button">Desktop</button></div><div class="status" id="status" aria-live="polite"></div></section></main><script type="module">import{supabase}from'./js/supabase.js';const $=x=>document.getElementById(x);async function load(){const{data:{user}}=await supabase.auth.getUser();if(!user){location.href='index.html?auth=1';return}$('email').textContent=user.email||'';const{data}=await supabase.from('profiles').select('*').eq('id',user.id).single();if(data){$('name').value=data.display_name||'';$('username').value=data.username||'';$('bio').value=data.bio||''}}$('save').onclick=async()=>{const{data:{user}}=await supabase.auth.getUser();if(!user)return;const{error}=await supabase.from('profiles').update({display_name:$('name').value.trim()||null,username:$('username').value.trim()||null,bio:$('bio').value.trim()||null}).eq('id',user.id);$('status').textContent=error?error.message:'Profile saved.'};$('logout').onclick=async()=>{await supabase.auth.signOut();location.href='index.html'};$('desktop').onclick=()=>{location.href='index.html'};load();</script></body></html>
