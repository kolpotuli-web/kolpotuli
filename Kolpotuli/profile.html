<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolpotuli Profile</title><style>body{margin:0;background:#10283d;color:#fff;font:16px Arial,sans-serif}.wrap{max-width:720px;margin:70px auto;padding:25px}.card{background:#ffffff12;border:1px solid #fff3;border-radius:24px;padding:28px}.avatar{width:80px;height:80px;border-radius:50%;background:#f4b52c;color:#10283d;display:grid;place-items:center;font-size:34px;font-weight:bold}input,textarea,button{font:inherit}.field{margin:15px 0}.field label{display:block;font-size:12px;opacity:.65;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #fff3;background:#fff1;color:#fff;box-sizing:border-box}.field textarea{min-height:110px}.actions{display:flex;gap:10px}.actions button{padding:11px 15px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.save{background:#f4b52c;color:#10283d}.out{background:#fff2;color:#fff}.status{min-height:22px;margin-top:12px}</style></head><body><div class="wrap"><div class="card"><div class="avatar">ক</div><h1>Kolpotuli Profile</h1><p id="email"></p><div class="field"><label>Display name</label><input id="name"></div><div class="field"><label>Username</label><input id="username"></div><div class="field"><label>Bio</label><textarea id="bio"></textarea></div><div class="actions"><button class="save" id="save">Save profile</button><button class="out" id="logout">Sign out</button><button class="out" onclick="location.href='index.html'">Desktop</button></div><div class="status" id="status"></div></div></div><script type="module">import{supabase}from'./js/supabase.js';const $=x=>document.getElementById(x);async function load(){const{data:{user}}=await supabase.auth.getUser();if(!user){location.href='index.html';return}$('email').textContent=user.email||'';const{data}=await supabase.from('profiles').select('*').eq('id',user.id).single();if(data){$('name').value=data.display_name||'';$('username').value=data.username||'';$('bio').value=data.bio||''}}$('save').onclick=async()=>{const{data:{user}}=await supabase.auth.getUser();if(!user)return;const{error}=await supabase.from('profiles').update({display_name:$('name').value.trim()||null,username:$('username').value.trim()||null,bio:$('bio').value.trim()||null}).eq('id',user.id);$('status').textContent=error?error.message:'Profile saved.'};$('logout').onclick=async()=>{await supabase.auth.signOut();location.href='index.html'};load();</script></body></html>
