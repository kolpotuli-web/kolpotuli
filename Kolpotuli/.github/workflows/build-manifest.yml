name: Build content manifest
on:
  push:
    paths:
      - 'Kolpotuli/stories/**'
      - 'Kolpotuli/art/**'
      - 'Kolpotuli/blogs/**'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate manifest
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('Kolpotuli')
          def title(p):
              s=re.sub(r'[-_]+',' ',p.stem)
              return re.sub(r'\b\w',lambda m:m.group().upper(),s)
          stories=[]
          for folder,lang in [('english','English'),('bengali','Bengali')]:
              for p in sorted((root/'stories'/folder).glob('*.pdf')):
                  stories.append({'id':p.as_posix(), 'path':p.as_posix().replace('Kolpotuli/',''),'title':title(p),'author':'Kolpotuli','language':lang,'category':'Other','tags':[]})
          art=[]
          for p in sorted((root/'art').glob('*')):
              if p.suffix.lower() in {'.jpg','.jpeg','.png','.webp'}:
                  art.append({'path':p.as_posix().replace('Kolpotuli/',''),'title':title(p)})
          blogs=[]
          for p in sorted((root/'blogs').glob('*')):
              if p.suffix.lower() in {'.md','.html','.txt'}:
                  blogs.append({'path':p.as_posix().replace('Kolpotuli/',''),'title':title(p)})
          (root/'content-manifest.json').write_text(json.dumps({'stories':stories,'art':art,'blogs':blogs},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Kolpotuli/content-manifest.json
          git diff --cached --quiet || git commit -m 'chore: rebuild content manifest'
          git push
