<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283d"><title>Kolpotuli Creator Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--navy:#10283d;--teal:#2f657d;--gold:#f4b52c;--cream:#f6edd9;--paper:#fffaf0;--ink:#14202a;--line:rgba(20,32,42,.12);--focus:#f4b52c}*{box-sizing:border-box}html{background:#081725}body{margin:0;background:linear-gradient(135deg,#081725,#173a55);font-family:"DM Sans",sans-serif;color:var(--ink);min-height:100vh}.shell{max-width:1180px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;font:700 25px "Noto Serif Bengali";color:var(--navy);box-shadow:0 10px 30px #0005}.top h1{font-size:22px;margin:0}.top small{opacity:.65}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.btn:focus-visible,.field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible{outline:2px solid var(--focus);outline-offset:3px}.back{background:#ffffff18;color:#fff}.panel{background:#fffaf0eF;border:1px solid #fff6;border-radius:24px;box-shadow:0 25px 70px #0005;padding:26px}.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.toolbar .btn{background:#eee3c9}.toolbar .btn.active{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none;font:inherit;color:var(--ink)}.field textarea{min-height:180px;resize:vertical}.bn{font-family:"Noto Serif Bengali",serif}.check{display:flex;gap:8px;align-items:center}.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.publish{background:var(--gold);color:var(--navy)}.save{background:var(--navy);color:#fff}.status{min-height:20px;margin:8px 0;color:var(--teal);font-weight:600}.items{display:grid;gap:10px}.item{background:#fff;border:1px solid #14202a14;border-radius:15px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item strong{display:block}.item small{opacity:.6}.item button{border:0;background:#10283d10;border-radius:9px;padding:7px 10px;cursor:pointer}.item button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.section-rule{border:0;border-top:1px solid #14202a15;margin:28px 0} @media(max-width:800px){.shell{padding:18px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px}.top .btn{display:none}.panel{padding:20px}.actions{justify-content:stretch}.actions .btn{flex:1}.item{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="mark" aria-hidden="true">ক</div><div><h1>Kolpotuli Creator Studio</h1><small>Stories · Art · Blogs</small></div></div><button class="btn back" type="button" onclick="location.href='index.html'">← Desktop</button></header><main class="panel"><div class="toolbar" aria-label="Content type"><button class="btn active" type="button" data-type="story">Story</button><button class="btn" type="button" data-type="art">Art</button><button class="btn" type="button" data-type="blog">Blog</button></div><form id="editor"><div class="grid"><div><div class="field"><label for="title">Title</label><input id="title" required autocomplete="off"></div><div class="field"><label for="slug">Slug</label><input id="slug" required autocomplete="off"></div><div class="field"><label for="language">Language</label><select id="language"><option value="en">English</option><option value="bn">বাংলা</option></select></div><div class="field"><label for="excerpt">Excerpt</label><textarea id="excerpt" style="min-height:90px"></textarea></div><div class="field"><label for="cover">Cover image URL</label><input id="cover" type="url" inputmode="url" placeholder="https://…"></div><div class="field"><label for="readtime">Read time</label><input id="readtime" type="number" min="0" inputmode="numeric"></div><label class="check"><input id="featured" type="checkbox"> Featured</label></div><div><div class="field"><label for="body">Body</label><textarea id="body" class="bn" placeholder="Write the full piece here…"></textarea></div><div class="field"><label for="categories">Categories</label><input id="categories" placeholder="culture, literature"></div><div class="field"><label for="tags">Tags</label><input id="tags" placeholder="river, bengal, memory"></div></div></div><div class="status" id="status" aria-live="polite"></div><div class="actions"><button class="btn save" type="submit">Save Draft</button><button class="btn publish" type="button" id="publish">Publish</button></div></form><hr class="section-rule"><h2 style="font-size:18px">Your content</h2><div class="items" id="items" aria-live="polite"><small>Loading…</small></div></main></div><script type="module">import{supabase}from'./js/supabase.js';let type='story',editing=null;const $=id=>document.getElementById(id);const status=m=>$('status').textContent=m;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type});function slugify(s){return s.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-')}async function guard(){const{data:{user}}=await supabase.auth.getUser();if(!user){location.href='index.html';return null}const{data:p}=await supabase.from('profiles').select('role').eq('id',user.id).single();if(!p||!['admin','editor'].includes(p.role)){document.body.innerHTML='<div style="color:white;text-align:center;padding:80px;font-family:DM Sans"><h1>Creator access required</h1><p>Your account needs editor or admin permission.</p><a style="color:#f4b52c" href="index.html">Return to Kolpotuli</a></div>';return null}return user}async function load(){const{data,error}=await supabase.from('content_items').select('id,type,title,slug,status,featured,created_at').order('created_at',{ascending:false});if(error){status(error.message);return}$('items').innerHTML=(data||[]).map(x=>`<div class="item"><div><strong>${x.title}</strong><small>${x.type} · ${x.status}${x.featured?' · featured':''}</small></div><button type="button" data-edit="${x.id}">Edit</button></div>`).join('')||'<small>No content yet.</small>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}async function edit(id){const{data}=await supabase.from('content_items').select('*').eq('id',id).single();if(!data)return;editing=id;type=data.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x.dataset.type===type));$('title').value=data.title||'';$('slug').value=data.slug||'';$('language').value=data.language||'en';$('excerpt').value=data.excerpt||'';$('cover').value=data.cover_image_url||'';$('readtime').value=data.read_time_minutes||'';$('featured').checked=!!data.featured;$('body').value=data.body||'';status('Editing '+data.title)}async function save(publish){const user=await guard();if(!user)return;const title=$('title').value.trim();const payload={type,title,slug:($('slug').value.trim()||slugify(title)),language:$('language').value,excerpt:$('excerpt').value.trim()||null,body:$('body').value,cover_image_url:$('cover').value.trim()||null,read_time_minutes:$('readtime').value?Number($('readtime').value):null,featured:$('featured').checked,status:publish?'published':'draft',author_id:user.id,published_at:publish?new Date().toISOString():null};status('Saving…');const q=editing?supabase.from('content_items').update(payload).eq('id',editing):supabase.from('content_items').insert(payload);const{error}=await q;if(error){status(error.message);return}status(publish?'Published successfully.':'Draft saved.');editing=null;$('editor').reset();load()}$('title').addEventListener('input',()=>{if(!editing&&!$('slug').value)$('slug').value=slugify($('title').value)});$('editor').onsubmit=e=>{e.preventDefault();save(false)};$('publish').onclick=()=>save(true);if(await guard())load();</script></body></html>
