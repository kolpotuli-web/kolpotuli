<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283d"><title>Kolpotuli Creator Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/desktop.css"><link rel="stylesheet" href="css/macos.css"><style>:root{--navy:#10283d;--teal:#2f657d;--gold:#f4b52c;--cream:#f6edd9;--paper:#fffaf0;--ink:#14202a;--line:rgba(20,32,42,.12);--focus:#f4b52c}*{box-sizing:border-box}html{background:#081725}body{margin:0;background:linear-gradient(135deg,#081725,#173a55);font-family:"DM Sans",sans-serif;color:var(--ink);min-height:100vh}.shell{max-width:1180px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;font:700 25px "Noto Serif Bengali";color:var(--navy);box-shadow:0 10px 30px #0005}.top h1{font-size:22px;margin:0}.top small{opacity:.65}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.btn:focus-visible,.field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible{outline:2px solid var(--focus);outline-offset:3px}.back{background:#ffffff18;color:#fff}.panel{background:#fffaf0eF;border:1px solid #fff6;border-radius:24px;box-shadow:0 25px 70px #0005;padding:26px}.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.toolbar .btn{background:#eee3c9}.toolbar .btn.active{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none;font:inherit;color:var(--ink)}.field textarea{min-height:180px;resize:vertical}.bn{font-family:"Noto Serif Bengali",serif}.check{display:flex;gap:8px;align-items:center}.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.publish{background:var(--gold);color:var(--navy)}.save{background:var(--navy);color:#fff}.status{min-height:20px;margin:8px 0;color:var(--teal);font-weight:600}.items{display:grid;gap:10px}.item{background:#fff;border:1px solid #14202a14;border-radius:15px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item strong{display:block}.item small{opacity:.6}.item button{border:0;background:#10283d10;border-radius:9px;padding:7px 10px;cursor:pointer}.item button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.section-rule{border:0;border-top:1px solid #14202a15;margin:28px 0} @media(max-width:800px){.shell{padding:18px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px}.top .btn{display:none}.panel{padding:20px}.actions{justify-content:stretch}.actions .btn{flex:1}.item{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* Creator Studio adopts the same restrained window surfaces as the desktop. */
body{background:radial-gradient(circle at 25% 10%,rgba(255,255,255,.12),transparent 30%),linear-gradient(135deg,#0a1e2b,#173a55);color:var(--mac-ink,#1d252b)}
.shell{max-width:1240px;padding:42px 24px}
.top{margin-bottom:18px}
.brand .mark{border-radius:11px}
.panel{background:var(--mac-content,rgba(255,253,247,.97));border:1px solid var(--mac-line-strong,rgba(23,40,52,.2));border-radius:13px;box-shadow:var(--mac-shadow-lg);padding:24px}
.btn{border-radius:7px;padding:9px 13px;font-weight:600;font-size:12px}
.toolbar .btn{background:rgba(128,138,142,.12);color:var(--mac-secondary)}
.toolbar .btn.active{background:var(--mac-blue);color:#fff}
.field label{color:var(--mac-secondary);font-size:10px}
.field input,.field textarea,.field select{border-radius:7px;border-color:var(--mac-line-strong);background:var(--mac-panel);color:var(--mac-ink);font-size:13px}
.save{background:var(--mac-blue);color:white}
.publish{background:var(--mac-gold);color:#10283d}
.status{color:var(--mac-secondary);font-size:12px}
.item{background:var(--mac-panel);border:1px solid var(--mac-line);border-radius:8px}
.item button{color:var(--mac-ink);background:rgba(128,138,142,.12);border-radius:6px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark} .panel{color:#f1f0e9} .field input,.field textarea,.field select{color:#f1f0e9} .item{color:#f1f0e9}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="mark" aria-hidden="true">ক</div><div><h1>Kolpotuli Creator Studio</h1><small>Stories · Art · Blogs</small></div></div><button class="btn back" type="button" id="backDesktop">← Desktop</button></header><main class="panel"><div class="toolbar" aria-label="Content type"><button class="btn active" type="button" data-type="story">Story</button><button class="btn" type="button" data-type="art">Art</button><button class="btn" type="button" data-type="blog">Blog</button></div><form id="editor"><div class="grid"><div><div class="field"><label for="title">Title</label><input id="title" required autocomplete="off"></div><div class="field"><label for="slug">Slug</label><input id="slug" autocomplete="off" placeholder="my-story"></div><div class="field"><label for="language">Language</label><select id="language"><option value="en">English</option><option value="bn">বাংলা</option></select></div><div class="field"><label for="excerpt">Excerpt</label><textarea id="excerpt" style="min-height:90px"></textarea></div><div class="field"><label for="cover">Cover image URL</label><input id="cover" type="url" inputmode="url" placeholder="https://…"></div><div class="field"><label for="readtime">Read time</label><input id="readtime" type="number" min="0" inputmode="numeric"></div><label class="check"><input id="featured" type="checkbox"> Featured</label></div><div><div class="field"><label for="body">Body</label><textarea id="body" class="bn" placeholder="Write the full piece here…"></textarea></div><div class="field"><label for="categories">Categories</label><input id="categories" placeholder="culture, literature"></div><div class="field"><label for="tags">Tags</label><input id="tags" placeholder="river, bengal, memory"></div></div></div><div class="status" id="status" aria-live="polite"></div><div class="actions"><button class="btn save" type="submit">Save Draft</button><button class="btn publish" type="button" id="publish">Publish</button></div></form><hr class="section-rule"><h2 style="font-size:18px">Your content</h2><div class="items" id="items" aria-live="polite"><small>Loading…</small></div></main></div><script type="module" src="js/admin.js"></script></body></html>
